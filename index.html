<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's New These Days</title>
<meta name="description" content="Open-source threat intelligence briefs.">
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--muted:#57606a;--line:#d8dee4;--link:#0b57d0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e8eb;--muted:#9aa4b2;--line:#2a2f37;--link:#8ab4f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 28px}
ul{list-style:none;margin:0;padding:0}
li{padding:18px 0;border-top:1px solid var(--line)}
li a{color:var(--link);font-weight:600;font-size:1.08rem;text-decoration:none}
li a:hover{text-decoration:underline}
li p{margin:6px 0 0}
.meta{color:var(--muted);font-size:.88rem}
.empty{color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <h1>What's New These Days</h1>
  <p class="lede">Threat intelligence briefs built from open sources. 0 published.</p>
  <ul>
    <li class="empty">No briefs published yet.</li>
  </ul>
  <footer>Indicators are defanged. Briefs reflect public reporting at the time of writing and are not advice. Some analytic sections are withheld from the public edition.</footer>
</main>
</body>
</html>
